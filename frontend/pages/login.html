<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorLink — Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
  <style>
    body { background: var(--gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: white; border-radius: var(--radius-lg); padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); }
    .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--gray-400); font-size: 0.85rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
    .password-wrapper { position: relative; }
    .password-toggle { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray-400); cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <a class="navbar-brand" href="index.html" style="font-size:1.8rem;">Mentor<span>Link</span></a>
      <p style="font-size:0.88rem; color:var(--gray-400); margin-top:0.5rem;">Connecte-toi à ton espace IFRI</p>
    </div>

    <form onsubmit="return false;">
      <div class="mb-3">
        <label class="form-label-mentor">Email ou numéro de téléphone</label>
        <div style="position:relative;">
          <i class="bi bi-person" style="position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--gray-400);"></i>
          <input type="text" class="form-control-mentor" placeholder="ex: nom@ifri.uac.bj" style="padding-left:2.5rem;" />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label-mentor">Mot de passe</label>
        <div class="password-wrapper">
          <i class="bi bi-lock" style="position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--gray-400);"></i>
          <input type="password" id="pwd" class="form-control-mentor" placeholder="Ton mot de passe" style="padding-left:2.5rem; padding-right:3rem;" />
          <button type="button" class="password-toggle" onclick="togglePwd()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check" style="margin:0;">
          <input class="form-check-input" type="checkbox" id="remember" />
          <label class="form-check-label" for="remember" style="font-size:0.85rem; color:var(--gray-600);">Se souvenir de moi</label>
        </div>
        <a href="forgot_password.html" style="font-size:0.85rem; color:var(--primary); text-decoration:none; font-weight:500;">Mot de passe oublié ?</a>
      </div>

      <button type="submit" style="width:100%; padding:0.85rem; font-size:1rem; font-weight:600; font-family:'Poppins',sans-serif; background:var(--primary); color:white; border:none; border-radius:50px; cursor:pointer; transition:background 0.2s;" onmouseover="this.style.background='var(--primary-dark)'" onmouseout="this.style.background='var(--primary)'" onclick="window.location.href='dashboard.html'">
        Se connecter
      </button>
    </form>

    <div class="divider">ou</div>

    <div class="text-center">
      <p style="font-size:0.88rem; color:var(--gray-600);">
        Pas encore de compte ?
        <a href="register.html" style="color:var(--primary); font-weight:600; text-decoration:none;">S'inscrire</a>
      </p>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" style="font-size:0.82rem; color:var(--gray-400); text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Retour à l'accueil
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function togglePwd() {
      const pwd = document.getElementById('pwd');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
