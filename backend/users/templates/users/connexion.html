<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - IFRI MentorLink</title>
</head>
<body>
    <h1>Se connecter</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>

    <p><a href="{% url 'demande_reinitialisation' %}">Mot de passe oublié ?</a></p>
    <p>Pas encore inscrit ? <a href="{% url 'inscription' %}">Créer un compte</a></p>
</body>
</html>
